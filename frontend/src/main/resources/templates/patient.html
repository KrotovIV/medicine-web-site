<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Карта пациента - Медицинский кабинет</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #faf7f0;
            background-image: radial-gradient(#e0d5c0 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: auto;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 15px 25px;
            background-color: rgba(255, 248, 235, 0.9);
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(180, 150, 100, 0.15);
            border: 2px solid #ecd9b4;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 2px dashed #d4b68a;
            border-radius: 25px;
            pointer-events: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #a77b4f;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            padding: 10px 20px;
            background-color: #fff0db;
            border: 2px solid #ecd9b4;
            border-radius: 50px;
            transition: all 0.2s ease;
        }

        .back-link:hover {
            background-color: #ffe9d1;
            transform: translateX(-3px);
            border-color: #dbbd95;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .patient-badge {
            background-color: #fff0db;
            padding: 10px 20px;
            border-radius: 50px;
            border: 2px solid #ecd9b4;
            color: #7d5e3a;
            font-weight: 500;
        }

        /* Переключатель режимов */
        .view-switcher {
            display: flex;
            gap: 10px;
            background-color: #fff0db;
            border: 2px solid #ecd9b4;
            border-radius: 50px;
            padding: 5px;
        }

        .view-btn {
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #7d5e3a;
            font-weight: 500;
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .view-btn.active {
            background-color: #e6c9a8;
            border-color: #c4a177;
            color: #5f4a2e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .view-btn:hover:not(.active) {
            background-color: #ffe9d1;
        }

        /* Фильтры */
        .filters {
            background-color: #fffaf0;
            border: 3px solid #ecd9b4;
            border-radius: 50px;
            padding: 15px 25px;
            margin-bottom: 40px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }

        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background-color: #fff0db;
            border: 2px solid #ecd9b4;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #7d5e3a;
            font-weight: 500;
        }

        .filter-tag.active {
            background-color: #e6c9a8;
            border-color: #c4a177;
            color: #5f4a2e;
        }

        .filter-tag:hover {
            transform: translateY(-2px);
            border-color: #dbbd95;
        }

        /* ========== РЕЖИМ КАРТЫ СВЯЗЕЙ ========== */
        .view-mode {
            display: none;
        }

        .view-mode.active {
            display: block;
        }

        .patient-map {
            position: relative;
            min-height: 700px;
            margin: 40px 0;
            background: rgba(255, 248, 235, 0.3);
            border-radius: 60px;
            overflow: visible;
        }

        .central-card {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            width: 280px;
            background: linear-gradient(145deg, #fffaf0, #fff5e8);
            border: 4px solid #e6c9a8;
            border-radius: 50px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(170, 140, 100, 0.25);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .central-card:hover {
            transform: translate(-50%, -50%) scale(1.02);
            box-shadow: 0 20px 40px rgba(170, 140, 100, 0.3);
        }

        .patient-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #fff5e8, #f5e6d3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 15px;
            border: 4px solid #e6c9a8;
            box-shadow: 0 8px 0 #d2b48c;
        }

        .patient-name {
            font-size: 1.8rem;
            color: #7d5e3a;
            font-weight: 600;
            margin: 10px 0;
        }

        .patient-age {
            color: #a77b4f;
            font-size: 1.1rem;
            background-color: #fff0db;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 40px;
            border: 2px solid #ecd9b4;
        }

        .media-nodes {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 700px;
            z-index: 5;
        }

        .media-card {
            position: absolute;
            width: 280px;
            background: #fffaf0;
            border: 3px solid #ecd9b4;
            border-radius: 30px;
            padding: 15px;
            cursor: grab;
            transition: box-shadow 0.2s ease, transform 0.1s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            z-index: 20;
            will-change: left, top;
        }

        .media-card:active {
            cursor: grabbing;
        }

        .media-card.dragging {
            opacity: 0.8;
            cursor: grabbing;
            z-index: 1000;
            transition: none;
        }

        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(170, 140, 100, 0.2);
            border-color: #dbbd95;
        }

        .connections-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .connections-canvas svg {
            width: 100%;
            height: 100%;
        }

        .connection-line {
            stroke: #dbbd95;
            stroke-width: 2;
            stroke-dasharray: 5 5;
            fill: none;
        }

        /* ========== РЕЖИМ ТАЙМЛАЙН ========== */
        .timeline-view {
            margin: 40px 0;
            position: relative;
            overflow-x: auto;
        }

        .timeline-container {
            position: relative;
            min-height: 600px;
            padding: 40px 0;
        }

        /* Центральная линия времени */
        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #e6c9a8, #c4a177, #e6c9a8);
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(196, 161, 119, 0.3);
        }

        .timeline-line::before,
        .timeline-line::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background-color: #c4a177;
            border-radius: 50%;
            border: 3px solid #fff0db;
        }

        .timeline-line::before {
            top: -8px;
        }

        .timeline-line::after {
            bottom: -8px;
        }

        /* Точки на линии времени */
        .timeline-dot {
            position: absolute;
            left: 50%;
            width: 12px;
            height: 12px;
            background-color: #dbbd95;
            border-radius: 50%;
            transform: translateX(-50%);
            border: 2px solid #fffaf0;
            z-index: 5;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .timeline-dot:hover {
            transform: translateX(-50%) scale(1.5);
            background-color: #c4a177;
        }

        /* Карточки в таймлайне */
        .timeline-card {
            position: absolute;
            width: 280px;
            background: #fffaf0;
            border: 3px solid #ecd9b4;
            border-radius: 30px;
            padding: 15px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .timeline-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(170, 140, 100, 0.2);
            border-color: #dbbd95;
        }

        .timeline-card.left {
            right: calc(50% + 30px);
            left: auto;
        }

        .timeline-card.right {
            left: calc(50% + 30px);
            right: auto;
        }

        /* Адаптивность для таймлайна */
        @media (max-width: 768px) {
            .timeline-line {
                left: 30px;
            }
            .timeline-dot {
                left: 30px;
            }
            .timeline-card.left,
            .timeline-card.right {
                left: 80px;
                right: 20px;
                width: calc(100% - 100px);
            }
            .timeline-card.left {
                right: auto;
            }
        }

        /* Общие стили для карточек */
        .media-type-icon {
            font-size: 2rem;
            margin-bottom: 10px;
            text-align: center;
        }

        .media-content {
            margin: 10px 0;
        }

        .media-content img, .media-content video {
            width: 100%;
            border-radius: 20px;
            border: 2px solid #ecd9b4;
        }

        .media-content audio {
            width: 100%;
        }

        .text-note {
            background-color: #fff5e8;
            padding: 10px;
            border-radius: 20px;
            border-left: 4px solid #e6c9a8;
            font-style: italic;
            color: #5f4a2e;
            font-size: 0.9rem;
            max-height: 150px;
            overflow-y: auto;
        }

        .media-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 2px dashed #ecd9b4;
            font-size: 0.7rem;
            color: #b99e7c;
        }

        .media-date {
            margin-bottom: 8px;
        }

        .note-field {
            margin: 8px 0;
            padding: 5px;
            background-color: #fff9f0;
            border-radius: 15px;
            font-size: 0.8rem;
            color: #7d5e3a;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #fff0db;
        }

        .tag:hover {
            transform: scale(1.05);
            background-color: #ffe9d1;
        }

        .tag-circle {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Кнопка добавления */
        .add-media-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #fff0db;
            border: 3px solid #dbbd95;
            border-radius: 60px;
            padding: 15px 30px;
            color: #a77b4f;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 0 #d2b48c;
            transition: all 0.2s ease;
            z-index: 100;
        }

        .add-media-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 0 #c4a177;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Шапка -->
    <div class="header">
        <a href="/" class="back-link">
            ← На главную
        </a>
        <div class="header-controls">
            <div class="view-switcher">
                <button class="view-btn active" data-view="graph">🗺️ Карта связей</button>
                <button class="view-btn" data-view="timeline">📅 Таймлайн</button>
            </div>
            <div class="patient-badge">
                👨‍⚕️ <span th:text="${username}">Доктор</span>
            </div>
        </div>
    </div>

    <!-- Фильтры по тегам -->
    <div class="filters" id="filters">
        <span class="filter-tag active" data-tag="all">📋 Все</span>
    </div>

    <!-- Режим: Карта связей -->
    <div id="graphView" class="view-mode active">
        <div class="patient-map" id="patientMap">
            <div class="central-card" id="centralCard">
                <div class="patient-avatar">👴</div>
                <div class="patient-name">Иван Иванов</div>
                <div class="patient-age">72 года</div>
                <div class="patient-age" style="margin-top: 8px;">📅 15.03.1954</div>
            </div>
            <div class="media-nodes" id="mediaNodes"></div>
            <div class="connections-canvas" id="connectionsCanvas">
                <svg></svg>
            </div>
        </div>
    </div>

    <!-- Режим: Таймлайн -->
    <div id="timelineView" class="view-mode">
        <div class="timeline-view">
            <div class="timeline-container" id="timelineContainer">
                <div class="timeline-line"></div>
                <div id="timelineCards"></div>
            </div>
        </div>
    </div>

    <!-- Кнопка добавления медиафайла -->
    <div class="add-media-btn" onclick="addNewMedia()">
        ➕ Добавить медиафайл
    </div>
</div>

<script th:inline="javascript">
    // Получаем список видео из Java
    const videosFromBackend = /*[[${videos}]]*/ [];

    // ID пациента из Java
    const patientId = /*[[${patientId}]]*/ 1;

    // Данные медиафайлов - видео будут из бекенда, остальные заглушки
    let mediaFiles = [
        {
            id: 1,
            type: 'photo',
            icon: '📸',
            content: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Santiago_cathedral_2021.jpg/960px-Santiago_cathedral_2021.jpg',
            date: '2024-03-15 14:30',
            dateObj: new Date(2024, 2, 15, 14, 30),
            note: 'Рентген грудной клетки',
            tags: ['рентген', 'грудная клетка'],
            position: { x: 350, y: 50 }
        },
        {
            id: 3,
            type: 'audio',
            icon: '🎵',
            content: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
            date: '2024-03-05 09:15',
            dateObj: new Date(2024, 2, 5, 9, 15),
            note: 'Запись голоса пациента',
            tags: ['голос', 'жалобы'],
            position: { x: 50, y: 400 }
        },
        {
            id: 4,
            type: 'text',
            icon: '📝',
            content: 'Жалобы на боли в области сердца, одышку при нагрузке. Рекомендовано: ЭКГ, консультация кардиолога.',
            date: '2024-03-01 16:45',
            dateObj: new Date(2024, 2, 1, 16, 45),
            note: 'Заметка врача',
            tags: ['заметка', 'симптомы'],
            position: { x: 350, y: 400 }
        }
    ];

    let nextId = 5;
    let draggedCard = null;
    let dragStartX = 0;
    let dragStartY = 0;
    let cardStartLeft = 0;
    let cardStartTop = 0;
    let currentFilter = 'all';
    let currentView = 'graph';
    let animationFrameId = null;

    const tagColors = {
        'рентген': '#e6c9a8',
        'грудная клетка': '#d4b68a',
        'осмотр': '#c4a177',
        'видео': '#b99e7c',
        'голос': '#ecd9b4',
        'жалобы': '#f5e6d3',
        'заметка': '#ffe9d1',
        'симптомы': '#fff0db',
        'новое': '#e6c9a8',
        'ЭКГ': '#e6c9a8',
        'анализ': '#d4b68a',
        'УЗИ': '#c4a177',
        'диагностика': '#b99e7c',
        'первичный': '#ecd9b4'
    };

    // ========== ИНИЦИАЛИЗАЦИЯ ВИДЕО ИЗ БЕКЕНДА ==========

    function initializeVideosFromBackend() {
        // Преобразуем видео из бекенда в формат mediaFiles
        const videoMedia = videosFromBackend.map((video, index) => {
            // Парсим дату
            let dateObj = new Date();
            let formattedDate = video.createdAt || '2024-03-20 10:00:00';

            if (formattedDate.includes('-')) {
                // Формат "2024-03-20 10:00:00"
                const parts = formattedDate.split(/[- :]/);
                if (parts.length >= 6) {
                    dateObj = new Date(parts[0], parts[1] - 1, parts[2], parts[3], parts[4], parts[5]);
                } else {
                    dateObj = new Date(formattedDate);
                }
            } else {
                dateObj = new Date(formattedDate);
            }

            // Форматируем дату для отображения
            const displayDate = dateObj.toLocaleString('ru-RU');

            return {
                id: nextId++,
                type: 'video',
                icon: '🎥',
                content: video.streamUrl, // Используем URL для стриминга
                date: displayDate,
                dateObj: dateObj,
                note: video.description || 'Видео пациента',
                tags: video.tags || ['видео'],
                position: { x: 50 + (index * 100), y: 50 + (index * 80) },
                isFromBackend: true,
                filename: video.filename
            };
        });

        // Добавляем видео в начало списка mediaFiles
        mediaFiles = [...videoMedia, ...mediaFiles];

        // Обновляем позиции для новых видео, чтобы они не накладывались
        const bounds = getBounds();
        mediaFiles.forEach(media => {
            if (media.isFromBackend && media.position && !media.position.adjusted) {
                const freePos = findFreePosition();
                media.position = freePos;
                media.position.adjusted = true;
            }
        });
    }

    // ========== ОСТАЛЬНЫЕ ФУНКЦИИ (без изменений) ==========

    function getFilteredMedia() {
        return currentFilter === 'all'
            ? mediaFiles
            : mediaFiles.filter(m => m.tags.includes(currentFilter));
    }

    function createMediaCardHTML(media, isTimeline = false) {
        let contentHtml = '';
        if (media.type === 'photo') {
            contentHtml = `<img src="${media.content}" alt="Фото" draggable="false">`;
        } else if (media.type === 'video') {
            contentHtml = `<video controls preload="metadata">
                            <source src="${media.content}" type="video/mp4">
                            Ваш браузер не поддерживает видео.
                           </video>`;
        } else if (media.type === 'audio') {
            contentHtml = `<audio controls><source src="${media.content}" type="audio/mpeg"></audio>`;
        } else if (media.type === 'text') {
            contentHtml = `<div class="text-note">${media.content}</div>`;
        }

        const tagsHtml = media.tags.map(tag => `
            <div class="tag" data-tag="${tag}" onclick="event.stopPropagation(); filterByTag('${tag}')">
                <span class="tag-circle" style="background-color: ${tagColors[tag] || '#e6c9a8'};"></span>
                ${tag}
            </div>
        `).join('');

        return `
            <div class="media-type-icon">${media.icon}</div>
            <div class="media-content">${contentHtml}</div>
            <div class="media-footer">
                <div class="media-date">🕒 ${media.date}</div>
                ${media.note ? `<div class="note-field">📌 ${media.note}</div>` : ''}
                <div class="tags">${tagsHtml}</div>
            </div>
        `;
    }

    // ========== РЕЖИМ КАРТЫ СВЯЗЕЙ ==========

    function getBounds() {
        const map = document.getElementById('patientMap');
        const centralCard = document.getElementById('centralCard');
        if (!map || !centralCard) return { minX: 20, maxX: 800, minY: 0, maxY: 400, centerX: 400, centerY: 350, cardWidth: 280, cardHeight: 320 };

        const mapRect = map.getBoundingClientRect();
        const mapWidth = mapRect.width;
        const mapHeight = mapRect.height;
        const cardWidth = 280;
        const cardHeight = 320;
        const minX = 20;
        const maxX = mapWidth - cardWidth - 20;
        const minY = 0;
        const maxY = mapHeight - cardHeight / 2 - 20;
        const centralRect = centralCard.getBoundingClientRect();
        const centralLeft = centralRect.left - mapRect.left;
        const centralTop = centralRect.top - mapRect.top;
        const centerX = centralLeft + centralRect.width / 2;
        const centerY = centralTop + centralRect.height / 2;
        return { minX, maxX, minY, maxY, centerX, centerY, cardWidth, cardHeight };
    }

    function findFreePosition() {
        const bounds = getBounds();
        const occupiedPositions = mediaFiles.map(m => ({ x: m.position?.x || 0, y: m.position?.y || 0 }));
        const angles = [0, 45, 90, 135, 180, 225, 270, 315, 30, 60, 120, 150, 210, 240, 300, 330];
        const distances = [200, 280, 360, 440];
        for (const distance of distances) {
            for (const angle of angles) {
                const radian = angle * Math.PI / 180;
                const x = bounds.centerX + Math.cos(radian) * distance - bounds.cardWidth / 2;
                const y = bounds.centerY + Math.sin(radian) * distance - bounds.cardHeight / 2;
                if (x < bounds.minX || x > bounds.maxX || y < bounds.minY || y > bounds.maxY) continue;
                let hasCollision = false;
                for (const pos of occupiedPositions) {
                    if (Math.abs(pos.x - x) < bounds.cardWidth && Math.abs(pos.y - y) < bounds.cardHeight) {
                        hasCollision = true;
                        break;
                    }
                }
                if (!hasCollision) return { x, y };
            }
        }
        return { x: bounds.centerX + 200 - bounds.cardWidth / 2, y: bounds.centerY - bounds.cardHeight / 2 };
    }

    function renderGraphView() {
        const container = document.getElementById('mediaNodes');
        if (!container) return;
        container.innerHTML = '';
        const filteredMedia = getFilteredMedia();
        filteredMedia.forEach(media => {
            if (!media.position) {
                media.position = findFreePosition();
            }
            const card = document.createElement('div');
            card.className = 'media-card';
            card.style.left = `${media.position.x}px`;
            card.style.top = `${media.position.y}px`;
            card.setAttribute('data-id', media.id);
            card.innerHTML = createMediaCardHTML(media);
            makeDraggable(card, media);
            container.appendChild(card);
        });
        setTimeout(updateConnections, 50);
    }

    function makeDraggable(card, media) {
        let isDragging = false;
        const onMouseMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            let newLeft = cardStartLeft + dx;
            let newTop = cardStartTop + dy;
            const bounds = getBounds();
            newLeft = Math.max(bounds.minX, Math.min(bounds.maxX, newLeft));
            newTop = Math.max(bounds.minY, Math.min(bounds.maxY, newTop));
            card.style.left = `${newLeft}px`;
            card.style.top = `${newTop}px`;
            media.position = { x: newLeft, y: newTop };
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => { updateConnections(); animationFrameId = null; });
        };
        const onMouseUp = () => {
            if (!isDragging) return;
            isDragging = false;
            card.classList.remove('dragging');
            card.style.cursor = 'grab';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        };
        const onMouseDown = (e) => {
            if (e.target.closest('.tag') || e.target.closest('audio') || e.target.closest('video') || e.target.closest('img')) return;
            e.preventDefault();
            isDragging = true;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            cardStartLeft = parseFloat(card.style.left);
            cardStartTop = parseFloat(card.style.top);
            card.classList.add('dragging');
            card.style.cursor = 'grabbing';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        };
        card.addEventListener('mousedown', onMouseDown);
        const onTouchMove = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - dragStartX;
            const dy = touch.clientY - dragStartY;
            let newLeft = cardStartLeft + dx;
            let newTop = cardStartTop + dy;
            const bounds = getBounds();
            newLeft = Math.max(bounds.minX, Math.min(bounds.maxX, newLeft));
            newTop = Math.max(bounds.minY, Math.min(bounds.maxY, newTop));
            card.style.left = `${newLeft}px`;
            card.style.top = `${newTop}px`;
            media.position = { x: newLeft, y: newTop };
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(() => { updateConnections(); animationFrameId = null; });
        };
        const onTouchStart = (e) => {
            if (e.target.closest('.tag') || e.target.closest('audio') || e.target.closest('video') || e.target.closest('img')) return;
            e.preventDefault();
            const touch = e.touches[0];
            isDragging = true;
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            cardStartLeft = parseFloat(card.style.left);
            cardStartTop = parseFloat(card.style.top);
            card.classList.add('dragging');
            document.addEventListener('touchmove', onTouchMove, { passive: false });
            document.addEventListener('touchend', onTouchEnd);
        };
        const onTouchEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            card.classList.remove('dragging');
            document.removeEventListener('touchmove', onTouchMove);
            document.removeEventListener('touchend', onTouchEnd);
        };
        card.addEventListener('touchstart', onTouchStart, { passive: false });
    }

    function updateConnections() {
        const svg = document.querySelector('#connectionsCanvas svg');
        if (!svg) return;
        const map = document.getElementById('patientMap');
        if (!map) return;
        const mapRect = map.getBoundingClientRect();
        const centralCard = document.getElementById('centralCard');
        if (!centralCard) return;
        const centralRect = centralCard.getBoundingClientRect();
        const centralX = centralRect.left + centralRect.width / 2 - mapRect.left;
        const centralY = centralRect.top + centralRect.height / 2 - mapRect.top;
        const mediaCards = document.querySelectorAll('.media-card');
        const lines = [];
        mediaCards.forEach(card => {
            const cardRect = card.getBoundingClientRect();
            const cardX = cardRect.left + cardRect.width / 2 - mapRect.left;
            const cardY = cardRect.top + cardRect.height / 2 - mapRect.top;
            lines.push(`<line x1="${centralX}" y1="${centralY}" x2="${cardX}" y2="${cardY}" class="connection-line"/>`);
        });
        const cardData = [];
        mediaCards.forEach(card => {
            const cardRect = card.getBoundingClientRect();
            const mediaId = parseInt(card.getAttribute('data-id'));
            const media = mediaFiles.find(m => m.id === mediaId);
            if (media) {
                cardData.push({
                    id: mediaId,
                    x: cardRect.left + cardRect.width / 2 - mapRect.left,
                    y: cardRect.top + cardRect.height / 2 - mapRect.top,
                    tags: media.tags
                });
            }
        });
        for (let i = 0; i < cardData.length; i++) {
            for (let j = i + 1; j < cardData.length; j++) {
                if (cardData[i].tags.some(tag => cardData[j].tags.includes(tag))) {
                    lines.push(`<line x1="${cardData[i].x}" y1="${cardData[i].y}" x2="${cardData[j].x}" y2="${cardData[j].y}" class="connection-line" style="stroke: #c4a177; stroke-dasharray: 3 3;"/>`);
                }
            }
        }
        svg.innerHTML = lines.join('');
    }

    // ========== РЕЖИМ ТАЙМЛАЙН ==========

    function renderTimelineView() {
        const container = document.getElementById('timelineCards');
        if (!container) return;
        container.innerHTML = '';

        const filteredMedia = [...getFilteredMedia()].sort((a, b) => (a.dateObj?.getTime() || 0) - (b.dateObj?.getTime() || 0));
        if (filteredMedia.length === 0) {
            container.innerHTML = '<div style="text-align: center; padding: 100px; color: #b99e7c;">Нет медиафайлов для отображения</div>';
            return;
        }

        // Временный контейнер для измерения высоты карточек
        const tempContainer = document.createElement('div');
        tempContainer.style.position = 'absolute';
        tempContainer.style.visibility = 'hidden';
        tempContainer.style.top = '-10000px';
        tempContainer.style.left = '-10000px';
        tempContainer.style.width = '280px'; // Такая же ширина как у карточек
        document.body.appendChild(tempContainer);

        const positions = [];
        let currentTop = 60; // Начальный отступ сверху
        const VERTICAL_GAP = 40; // Фиксированный отступ между карточками (можно настроить)

        for (let i = 0; i < filteredMedia.length; i++) {
            const media = filteredMedia[i];
            const side = i % 2 === 0 ? 'left' : 'right';

            // Создаем временную карточку для измерения высоты
            const tempCard = document.createElement('div');
            tempCard.className = `timeline-card ${side}`;
            tempCard.style.position = 'relative';
            tempCard.style.width = '280px';
            tempCard.innerHTML = createMediaCardHTML(media);
            tempContainer.appendChild(tempCard);

            // Получаем реальную высоту карточки
            const cardHeight = tempCard.offsetHeight;

            // Сохраняем позицию
            positions.push({
                id: media.id,
                top: currentTop,
                height: cardHeight,
                side: side
            });

            // Обновляем позицию для следующей карточки (текущая высота + отступ)
            currentTop += cardHeight + VERTICAL_GAP;

            // Очищаем временный контейнер для следующей итерации
            tempContainer.innerHTML = '';
        }

        // Удаляем временный контейнер
        document.body.removeChild(tempContainer);

        // Устанавливаем общую высоту контейнера
        const totalHeight = currentTop + 60; // Добавляем отступ снизу
        const timelineContainer = document.getElementById('timelineContainer');
        if (timelineContainer) {
            timelineContainer.style.minHeight = `${totalHeight}px`;
        }

        // Рендерим карточки с рассчитанными позициями
        for (let i = 0; i < filteredMedia.length; i++) {
            const media = filteredMedia[i];
            const pos = positions[i];

            const card = document.createElement('div');
            card.className = `timeline-card ${pos.side}`;
            card.setAttribute('data-id', media.id);
            card.style.top = `${pos.top}px`;
            card.innerHTML = createMediaCardHTML(media);
            container.appendChild(card);

            // Добавляем точку на линию времени (для всех, кроме последней)
            if (i < filteredMedia.length - 1) {
                const dot = document.createElement('div');
                dot.className = 'timeline-dot';
                // Располагаем точку по центру текущей карточки + половина отступа до следующей
                const nextPos = positions[i + 1];
                const dotTop = pos.top + pos.height + (VERTICAL_GAP / 2);
                dot.style.top = `${dotTop}px`;
                dot.title = media.date ? new Date(media.date).toLocaleString('ru-RU') : '';
                dot.onclick = () => {
                    const targetCard = document.querySelector(`.timeline-card[data-id="${media.id}"]`);
                    if (targetCard) targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                };
                container.appendChild(dot);
            }
        }

        // Добавляем точку в начале линии (опционально)
        const startDot = document.createElement('div');
        startDot.className = 'timeline-dot';
        startDot.style.top = `30px`;
        startDot.title = 'Начало';
        container.appendChild(startDot);
    }

    // ========== ОБЩИЕ ФУНКЦИИ ==========

    function addNewMedia() {
        const types = [
            { type: 'photo', icon: '📸', content: 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Santiago_cathedral_2021.jpg/960px-Santiago_cathedral_2021.jpg', tags: ['новое'] },
            { type: 'video', icon: '🎥', content: 'https://www.w3schools.com/html/mov_bbb.mp4', tags: ['новое'] },
            { type: 'audio', icon: '🎵', content: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', tags: ['новое'] },
            { type: 'text', icon: '📝', content: 'Новая заметка о пациенте...', tags: ['новое'] }
        ];
        const randomType = types[Math.floor(Math.random() * types.length)];
        const now = new Date();
        const freePos = findFreePosition();
        const newMedia = {
            id: nextId++,
            type: randomType.type,
            icon: randomType.icon,
            content: randomType.content,
            date: now.toLocaleString('ru-RU'),
            dateObj: new Date(now),
            note: 'Добавлено сегодня',
            tags: [...randomType.tags],
            position: freePos
        };
        mediaFiles.push(newMedia);
        refreshCurrentView();
        updateFiltersUI();
    }

    function filterByTag(tag) {
        currentFilter = tag;
        refreshCurrentView();
        updateFiltersUI();
    }

    function updateFiltersUI() {
        const filtersDiv = document.getElementById('filters');
        if (!filtersDiv) return;
        const allTags = ['all', ...new Set(mediaFiles.flatMap(m => m.tags))];
        filtersDiv.innerHTML = allTags.map(tag => `
            <span class="filter-tag ${currentFilter === tag ? 'active' : ''}"
                  data-tag="${tag}"
                  onclick="filterByTag('${tag}')">
                ${tag === 'all' ? '📋 Все' : `🏷️ ${tag}`}
            </span>
        `).join('');
    }

    function refreshCurrentView() {
        if (currentView === 'graph') {
            renderGraphView();
        } else {
            renderTimelineView();
        }
    }

    function switchView(view) {
        currentView = view;
        const graphView = document.getElementById('graphView');
        const timelineView = document.getElementById('timelineView');
        if (graphView) graphView.classList.toggle('active', view === 'graph');
        if (timelineView) timelineView.classList.toggle('active', view === 'timeline');
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-view') === view);
        });
        refreshCurrentView();
    }

    function handleResize() {
        if (currentView === 'graph') {
            const bounds = getBounds();
            let needsUpdate = false;
            mediaFiles.forEach(media => {
                if (media.position) {
                    if (media.position.x < bounds.minX) { media.position.x = bounds.minX; needsUpdate = true; }
                    if (media.position.x > bounds.maxX) { media.position.x = bounds.maxX; needsUpdate = true; }
                    if (media.position.y < bounds.minY) { media.position.y = bounds.minY; needsUpdate = true; }
                    if (media.position.y > bounds.maxY) { media.position.y = bounds.maxY; needsUpdate = true; }
                }
            });
            if (needsUpdate) renderGraphView();
            updateConnections();
        }
    }

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        // Инициализируем видео из бекенда
        initializeVideosFromBackend();

        const bounds = getBounds();
        mediaFiles.forEach(media => {
            if (media.position) {
                media.position.x = Math.max(bounds.minX, Math.min(bounds.maxX, media.position.x));
                media.position.y = Math.max(bounds.minY, Math.min(bounds.maxY, media.position.y));
            }
        });

        renderGraphView();
        updateFiltersUI();

        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => switchView(btn.getAttribute('data-view')));
        });

        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimeout);
            window.resizeTimeout = setTimeout(handleResize, 100);
        });

        const observer = new MutationObserver(() => {
            if (currentView === 'graph') updateConnections();
        });
        const mediaNodes = document.getElementById('mediaNodes');
        if (mediaNodes) {
            observer.observe(mediaNodes, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
        }
    });

    window.filterByTag = filterByTag;
    window.addNewMedia = addNewMedia;
</script>
