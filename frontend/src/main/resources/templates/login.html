<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        .container { max-width: 400px; margin: 100px auto; text-align: center; }
        .form-group { margin: 20px 0; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 30px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: red; padding: 10px; background-color: #f8d7da; border-radius: 5px; }
        .info { color: #6c757d; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Вход в систему</h1>

    <div th:if="${param.error}" class="error">
        Неверное имя пользователя или пароль
    </div>

    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <input type="text" name="username" placeholder="Имя пользователя" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="Пароль" required>
        </div>
        <button type="submit">Войти</button>
    </form>

    <div class="info">
        <p>Тестовый пользователь: test / password</p>
    </div>
</div>
</body>
</html>
