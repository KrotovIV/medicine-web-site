<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в медицинский кабинет</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #faf7f0;
            background-image: radial-gradient(#e0d5c0 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        /* Медицинская иконка сверху */
        .medical-icon {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .medical-icon span {
            font-size: 4rem;
            filter: drop-shadow(0 8px 0 #d2b48c);
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Основная карточка входа */
        .login-card {
            background-color: #fffaf0;
            border: 3px solid #ecd9b4;
            border-radius: 50px 50px 50px 50px;
            padding: 40px 35px;
            box-shadow: 0 15px 30px rgba(170, 140, 100, 0.2);
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* Декоративная рамка */
        .login-card::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px dashed #dbbd95;
            border-radius: 42px;
            pointer-events: none;
        }

        /* Заголовок */
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .login-title h1 {
            font-size: 2.2rem;
            color: #7d5e3a;
            font-weight: 500;
            letter-spacing: 1px;
            display: inline-block;
            padding: 0 20px 10px 20px;
            border-bottom: 4px dashed #e6c9a8;
        }

        .login-title p {
            color: #a77b4f;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        /* Форма */
        .login-form {
            margin: 30px 0 20px 0;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #7d5e3a;
            font-weight: 500;
            font-size: 1.1rem;
            padding-left: 10px;
        }

        .input-wrapper {
            position: relative;
            background-color: #fff9f0;
            border: 3px solid #ecd9b4;
            border-radius: 60px;
            padding: 3px;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: #dbbd95;
            box-shadow: 0 5px 15px rgba(180, 150, 100, 0.2);
            transform: scale(1.02);
            background-color: #ffffff;
        }

        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            color: #b99e7c;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 20px 16px 55px;
            border: none;
            background: transparent;
            font-size: 1rem;
            color: #5f4a2e;
            border-radius: 60px;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #d2b48c;
            font-style: italic;
        }

        /* Кнопка входа */
        .login-button {
            width: 100%;
            background-color: #fff0db;
            border: 3px solid #dbbd95;
            border-radius: 60px;
            padding: 18px 30px;
            color: #a77b4f;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 7px 0 #d2b48c;
            margin: 20px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .login-button:hover {
            background-color: #ffe9d1;
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #c4a177;
        }

        .login-button:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #c4a177;
        }

        .login-button::after {
            content: '⚕️';
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.3rem;
            opacity: 0.7;
        }

        /* Сообщение об ошибке */
        .error-message {
            background-color: #fff0db;
            border: 3px solid #e6b39a;
            border-radius: 50px;
            padding: 20px;
            margin: 20px 0;
            color: #b45f3a;
            font-weight: 500;
            text-align: center;
            position: relative;
            border-style: dashed;
        }

        .error-message::before {
            content: '⚠️';
            margin-right: 10px;
            font-size: 1.3rem;
        }

        /* Тестовые данные */
        .test-info {
            background-color: rgba(255, 240, 219, 0.7);
            border: 2px dashed #dbbd95;
            border-radius: 40px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
            position: relative;
        }

        .test-info p {
            color: #7d5e3a;
            margin: 5px 0;
        }

        .test-info .test-credentials {
            background-color: #fff9f0;
            border: 2px solid #ecd9b4;
            border-radius: 40px;
            padding: 12px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #a77b4f;
            display: inline-block;
        }

        .test-info .test-credentials span {
            background-color: #ffe4c4;
            padding: 5px 15px;
            border-radius: 30px;
            margin: 0 5px;
        }

        /* Ручные элементы декора */
        .hand-drawn-line {
            height: 2px;
            background: repeating-linear-gradient(90deg, #dbbd95 0px, #dbbd95 8px, transparent 8px, transparent 16px);
            margin: 25px 0;
        }

        .stethoscope-decoration {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            opacity: 0.6;
        }

        .stethoscope-decoration span {
            font-size: 1.5rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* Ссылка возврата на главную */
        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #b99e7c;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 2px dashed #dbbd95;
            padding-bottom: 3px;
            transition: all 0.2s ease;
        }

        .back-link a:hover {
            color: #7d5e3a;
            border-bottom-style: solid;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .login-title h1 {
                font-size: 1.8rem;
            }

            .login-button {
                font-size: 1.1rem;
                padding: 15px 20px;
            }

            .login-button::after {
                right: 15px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">
    <!-- Медицинская иконка -->
    <div class="medical-icon">
        <span>🏥</span>
    </div>

    <!-- Основная карточка входа -->
    <div class="login-card">
        <!-- Заголовок -->
        <div class="login-title">
            <h1>Вход в систему</h1>
            <p>Медицинский кабинет</p>
        </div>

        <!-- Сообщение об ошибке (если есть) -->
        <div th:if="${param.error}" class="error-message">
            Неверное имя пользователя или пароль
        </div>

        <!-- Форма входа -->
        <form method="post" th:action="@{/login}" class="login-form">
            <div class="form-group">
                <label>👤 Имя пользователя</label>
                <div class="input-wrapper">
                    <span class="input-icon">👨‍⚕️</span>
                    <input type="text"
                           name="username"
                           placeholder="Введите имя пользователя"
                           required
                           autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>🔐 Пароль</label>
                <div class="input-wrapper">
                    <span class="input-icon">⚕️</span>
                    <input type="password"
                           name="password"
                           placeholder="Введите пароль"
                           required
                           autocomplete="current-password">
                </div>
            </div>

            <!-- Декоративная линия -->
            <div class="hand-drawn-line"></div>

            <!-- Кнопка входа -->
            <button type="submit" class="login-button">
                Войти
            </button>
        </form>

        <!-- Информация о тестовом пользователе -->
        <div class="test-info">
            <p>🩺 Тестовые данные для входа</p>
            <div class="test-credentials">
                <span>test</span> / <span>password</span>
            </div>
            <p style="font-size: 0.9rem; margin-top: 10px; color: #b99e7c;">
                *используйте для демонстрации
            </p>
        </div>

        <!-- Декоративные элементы -->
        <div class="stethoscope-decoration">
            <span>🩺</span>
            <span>💊</span>
            <span>🌡️</span>
        </div>
    </div>

    <!-- Ссылка возврата (если нужно) -->
    <div class="back-link">
        <a href="/">← Вернуться на главную</a>
    </div>
</div>
</body>
</html>
