<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <style>
        .container { max-width: 800px; margin: 50px auto; text-align: center; }
        .auth-status { padding: 20px; margin: 20px; border-radius: 5px; }
        .authenticated { background-color: #d4edda; color: #155724; }
        .unauthenticated { background-color: #f8d7da; color: #721c24; }
        .btn { padding: 10px 20px; text-decoration: none; border-radius: 5px; margin: 10px; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1>Главная страница</h1>

    <div th:if="${isAuthenticated}" class="auth-status authenticated">
        <p>✅ Вы авторизованы как пользователь: <strong th:text="${username}">Пользователь</strong></p>
        <a href="/logout" class="btn btn-danger">Выйти</a>
    </div>

    <div th:unless="${isAuthenticated}" class="auth-status unauthenticated">
        <p>❌ Вы не авторизованыыыыыыыыыыыыыыыы</p>
        <a href="/login" class="btn btn-primary">Войти</a>
    </div>
</div>
</body>
</html>
