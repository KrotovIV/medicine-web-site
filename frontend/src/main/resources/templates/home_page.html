<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Медицинский кабинет - Пациенты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background-color: #faf7f0;
            background-image: radial-gradient(#e0d5c0 1px, transparent 1px);
            background-size: 30px 30px;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Шапка с профилем */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px 25px;
            background-color: rgba(255, 248, 235, 0.9);
            border-radius: 30px 30px 30px 30px;
            box-shadow: 0 8px 20px rgba(180, 150, 100, 0.15);
            border: 2px solid #ecd9b4;
            backdrop-filter: blur(5px);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 2px dashed #d4b68a;
            border-radius: 25px;
            pointer-events: none;
        }

        .welcome-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background-color: #f5e6d3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 3px solid #e6c9a8;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .welcome-text {
            font-size: 1.3rem;
            color: #7d5e3a;
        }

        .welcome-text strong {
            color: #a77b4f;
            font-weight: 600;
            background-color: #fff0db;
            padding: 5px 15px;
            border-radius: 40px;
            border: 2px solid #ecd9b4;
            margin-left: 10px;
        }

        .logout-btn {
            background-color: #fff0db;
            color: #b08a5c;
            border: 3px solid #dbbd95;
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(180, 150, 100, 0.1);
            position: relative;
        }

        .logout-btn:hover {
            background-color: #ffe4c4;
            border-color: #c4a177;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(180, 150, 100, 0.2);
        }

        .logout-btn:active {
            transform: translateY(0);
        }

        /* Заголовок раздела */
        .section-title {
            font-size: 2.2rem;
            color: #7d5e3a;
            margin: 40px 0 30px 20px;
            font-weight: 500;
            display: inline-block;
            padding: 0 30px 10px 30px;
            border-bottom: 4px dashed #e6c9a8;
            letter-spacing: 1px;
        }

        /* Сетка карточек */
        .patients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        /* Карточка пациента */
        .patient-card {
            background-color: #fffaf0;
            border: 3px solid #ecd9b4;
            border-radius: 35px 35px 35px 35px;
            padding: 25px 20px 20px 20px;
            box-shadow: 0 10px 25px rgba(170, 140, 100, 0.15);
            transition: all 0.25s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(2px);
            text-decoration: none;
        }

        .patient-card:hover {
            transform: translateY(-8px);
            border-color: #dbbd95;
            box-shadow: 0 18px 35px rgba(160, 130, 80, 0.2);
            background-color: #fffdf7;
        }

        .patient-card:active {
            transform: translateY(-2px);
        }

        .card-decoration {
            position: absolute;
            top: 10px;
            left: 15px;
            right: 15px;
            height: 15px;
            border-bottom: 2px dashed #e6c9a8;
        }

        .patient-avatar {
            width: 100px;
            height: 100px;
            background-color: #f5e6d3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 15px 0 15px 0;
            border: 4px solid #e6c9a8;
            box-shadow: 0 8px 0 #d2b48c;
            transition: all 0.2s ease;
        }

        .patient-card:hover .patient-avatar {
            box-shadow: 0 10px 0 #c4a177;
        }

        .patient-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: #7d5e3a;
            margin: 10px 0 5px 0;
            line-height: 1.3;
        }

        .patient-age {
            font-size: 1.2rem;
            color: #a77b4f;
            background-color: #fff0db;
            padding: 5px 18px;
            border-radius: 40px;
            border: 2px solid #ecd9b4;
            margin: 10px 0;
            display: inline-block;
        }

        .patient-condition {
            font-size: 1.1rem;
            color: #8f6f48;
            margin: 10px 0 5px 0;
            padding: 8px 0;
            border-top: 2px dashed #ecd9b4;
            border-bottom: 2px dashed #ecd9b4;
            width: 100%;
        }

        .last-visit {
            font-size: 0.95rem;
            color: #b99e7c;
            margin: 15px 0 5px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Заглушка для сообщения */
        .alert-message {
            background-color: rgba(255, 248, 235, 0.9);
            border: 3px dashed #dbbd95;
            border-radius: 60px;
            padding: 40px;
            text-align: center;
            margin: 50px 0;
            color: #7d5e3a;
            font-size: 1.3rem;
            backdrop-filter: blur(5px);
        }

        /* Кнопка добавления */
        .add-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: #fff0db;
            border: 3px solid #dbbd95;
            border-radius: 60px;
            padding: 15px 35px;
            margin: 40px 0 20px 0;
            color: #a77b4f;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 #d2b48c;
            text-decoration: none;
        }

        .add-button:hover {
            background-color: #ffe9d1;
            transform: translateY(-3px);
            box-shadow: 0 8px 0 #c4a177;
        }

        .add-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c4a177;
        }

        /* Рисованные элементы */
        .hand-drawn-line {
            height: 3px;
            background: repeating-linear-gradient(90deg, #dbbd95 0px, #dbbd95 10px, transparent 10px, transparent 20px);
            margin: 30px 0;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .patients-grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Шапка с информацией о пользователе -->
    <div class="header" th:if="${isAuthenticated}">
        <div class="welcome-section">
            <div class="avatar">👨‍⚕️</div>
            <div class="welcome-text">
                Здравствуйте, <strong th:text="${username}">Доктор</strong>
            </div>
        </div>
        <a href="/logout" class="logout-btn">🚪 Выйти</a>
    </div>

    <!-- Основной контент для авторизованного пользователя -->
    <div th:if="${isAuthenticated}">
        <h2 class="section-title">📋 Мои пациенты</h2>

        <!-- Сетка с карточками пациентов -->
        <div class="patients-grid">
            <!-- Список всех пациентов -->
            <a th:each="patient : ${patients}" class="patient-card"
               th:href="|/patient?id=${patient.id}|">
                <div class="card-decoration"></div>
                <div class="patient-avatar" th:text="${patient.avatar}">$avatar$</div>
                <div class="patient-name" th:text="${patient.name}">$name$</div>
                <div class="patient-age" th:text="${patient.age}">$age$</div>
                <div class="patient-condition" th:text="${patient.condition}">$condition$</div>
                <div class="last-visit" th:text="|🩺 Последний визит: ${patient.lastVisitDate}|">$last_visit$</div>
            </a>
        </div>

        <!-- Кнопка добавления нового пациента -->
        <div style="text-align: center;">
            <a class="add-button" href="/add">
                <span>➕</span> Добавить пациента
            </a>
        </div>

        <!-- Декоративная линия -->
        <div class="hand-drawn-line"></div>

        <!-- Информационная заглушка -->
        <div class="alert-message">
            ⚕️ При нажатии на карточку откроется страница пациента<br>
            <small style="color: #b99e7c;">(функционал в разработке)</small>
        </div>
    </div>

    <!-- Сообщение для неавторизованных (на всякий случай, но контроллер делает редирект) -->
    <div th:unless="${isAuthenticated}" class="alert-message" style="margin-top: 100px;">
        <p style="font-size: 2rem; margin-bottom: 20px;">🔒</p>
        <p>Неавторизованный доступ запрещен</p>
        <a href="/login" style="display: inline-block; margin-top: 30px; padding: 15px 40px; background-color: #fff0db; border: 3px solid #dbbd95; border-radius: 50px; text-decoration: none; color: #7d5e3a; font-weight: bold;">Войти в систему</a>
    </div>
</div>
</body>
</html>
